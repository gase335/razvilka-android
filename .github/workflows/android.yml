# Сборка debug-APK Развилки в облаке GitHub (Android SDK/NDK уже на раннере).
# Запуск: вкладка Actions → "Build APK" → Run workflow (или пуш в main).
# Результат: артефакт "razvilka-debug-apk" со скачиваемым .apk.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABI через запятую (arm64,x86_64,arm,x86)"
        default: "arm64"
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Не ставить устаревший пакет 'tools' (его больше нет в репозитории).
          packages: ''

      - name: NDK + платформа + build-tools
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-35" "build-tools;35.0.0"

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Android-таргеты Rust
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-jni/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'android-jni/Cargo.toml') }}

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка debug-APK
        working-directory: android-app
        run: gradle assembleDebug -PrustTargets=${{ github.event.inputs.abis || 'arm64' }} --no-daemon --stacktrace

      - name: Загрузка APK (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: razvilka-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Публикуем APK в ветку build-apk, чтобы его можно было забрать по git
      # (артефакты Actions отдаются с Azure-хоста, недоступного из песочницы).
      - name: Публикация APK в ветку build-apk
        if: success()
        run: |
          set -e
          APK=$(find android-app/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" /tmp/razvilka-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-apk
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/razvilka-debug.apk razvilka-debug.apk
          git add razvilka-debug.apk
          git commit -q -m "APK build ${GITHUB_SHA::7}"
          git push -f origin build-apk

      - name: Имя файла для релиза
        if: success()
        run: |
          APK=$(find android-app/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" razvilka-android-arm64.apk

      - name: Релиз на GitHub
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Развилка — Android (сборка ${{ github.run_number }})"
          body: |
            Debug-сборка Развилки под Android (arm64-v8a).
            Коммит ${{ github.sha }}.
            Установка: включить «Неизвестные источники» → открыть .apk → установить.
          files: razvilka-android-arm64.apk
          make_latest: true
