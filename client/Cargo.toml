[package]
name = "razvilka"
version = "1.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Портативный клиент csqtt с раздельным туннелированием, правилами приложений, несколькими конфигурациями и режимом прокси-сервера"
build = "build.rs"

[lib]
name = "razvilka"
path = "src/lib.rs"

[[bin]]
name = "razvilka"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:arboard"]
webview = ["dep:wry", "dep:winit"]
mock = []

[dependencies]
csqtt-core = { path = "../backend" }
anyhow = "1"
primp = "1.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
parking_lot = "0.12"
ipstack = "1.0.1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-tcp-cubic", "async"] }
socket2 = { version = "0.6", features = ["all"] }
flate2 = "1"
base64 = "0.22"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts", "clipboard", "links"], optional = true }
arboard = { version = "3", optional = true, default-features = false }
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal", "common-controls-v6"] }
wry = { version = "0.57", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = true
debug = false

[patch.crates-io]
primp = { path = "../backend/vendor/primp" }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts", "clipboard", "links", "x11"], optional = true }
